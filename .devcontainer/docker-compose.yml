version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces:cached # Mount the project directory
      - ~/.bash_history:/home/vscode/.bash_history:cached # Update path for vscode user
    command: sleep infinity
    networks:
      - devcontainer-network
    depends_on:
      # Add dependency on the db service
      - db
    environment:
      # Add environment variables for the app service
      - DB_HOST=db
      - DB_NAME=iamgate
      - DB_PORT=5432
      - DB_USER=iamgate_user
      - DB_PASSWORD=iamgate_password
      - DATABASE_URL=postgres://iamgate_user:iamgate_password@db:5432/iamgate?sslmode=disable
      - TEST_DB_HOST=test-db
      - TEST_DB_NAME=iamgate
      - TEST_DB_PORT=5432
      - TEST_DB_USER=iamgate_user
      - TEST_DB_PASSWORD=iamgate_password
      - TEST_DATABASE_URL=postgres://iamgate_user:iamgate_password@test-db:5432/iamgate?sslmode=disable

  db:
    # Add the database service
    image: postgres:16-alpine # Use a specific version of postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data # Persist data
    networks:
      - devcontainer-network
    environment:
      POSTGRES_DB: iamgate
      POSTGRES_USER: iamgate_user
      POSTGRES_PASSWORD: iamgate_password

  test-db:
    # Add the database service
    image: postgres:16-alpine # Use a specific version of postgres
    restart: unless-stopped
    volumes:
      - postgres-data-test:/var/lib/postgresql/data # Persist data
    networks:
      - devcontainer-network
    environment:
      POSTGRES_DB: iamgate
      POSTGRES_USER: iamgate_user
      POSTGRES_PASSWORD: iamgate_password

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auth.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    depends_on:
      - db
      - test-db
    networks:
      - devcontainer-network

networks:
  devcontainer-network:
    driver: bridge

volumes:
  # Define the named volume
  postgres-data:
  postgres-data-test:
